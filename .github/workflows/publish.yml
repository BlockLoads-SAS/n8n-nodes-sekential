# Publish version tags from main with npm provenance.
# See PUBLISHING.md for the first publication, trusted publishing, and releases.

name: Publish

on:
  push:
    tags:
      # Both 0.2.0 and v0.2.0 are accepted; the guard checks package.json.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check release tag and main history
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== version && tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} does not match package version ${version}`);
          }
          NODE
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'The tagged commit must be merged into main before publication.' >&2
            exit 1
          fi

      - name: Set up npm
        run: npm install --global npm@11.21.0

      - name: Install dependencies
        run: 'npm ci'

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Release
        # The n8n CLI lints, builds, and publishes with provenance in Actions.
        # NPM_TOKEN bootstraps a new npm package. Later releases use OIDC.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
